<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CV</title>
<link rel="stylesheet" href="../../styles/shared.css">
<link rel="stylesheet" href="../../styles/cv.css">
</head>
<body>
<div class="toolbar">
  <button id="printBtn" onclick="window.print()">Print / Save as PDF</button>
  <button class="secondary" onclick="switchDesign('classic')">Classic design</button>
  <button class="secondary" onclick="switchDesign('sidebar')">Sidebar design</button>
</div>
<main class="sheet" id="app"></main>

<!-- config.js sets APP_CONFIG.lang, which decides which base.<lang>.js loads below. -->
<script src="config.js"></script>
<script src="../../render/loader.js"></script>
<script>
  const lang = APP_CONFIG.lang || "en";
  loadScriptsInOrder(
    ["../../data/base." + lang + ".js", "../../render/labels.js", "../../render/render.js"],
    function () { renderCV(); }
  );
</script>
</body>
</html>
